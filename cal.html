<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MG 맞춤형 대출 상환 계산기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 나눔바른고딕 웹폰트 로드 (눈누 제공 CDN) -->
    <style>
        @font-face {
            font-family: 'NanumBarunGothic';
            font-style: normal;
            font-weight: 400;
            src: url('//cdn.jsdelivr.net/font-nanumlight/1.0/NanumBarunGothicWeb.eot');
            src: url('//cdn.jsdelivr.net/font-nanumlight/1.0/NanumBarunGothicWeb.eot?#iefix') format('embedded-opentype'), url('//cdn.jsdelivr.net/font-nanumlight/1.0/NanumBarunGothicWeb.woff') format('woff'), url('//cdn.jsdelivr.net/font-nanumlight/1.0/NanumBarunGothicWeb.ttf') format('truetype');
        }

        @font-face {
            font-family: 'NanumBarunGothic';
            font-style: normal;
            font-weight: 700;
            src: url('//cdn.jsdelivr.net/font-nanumlight/1.0/NanumBarunGothicWebBold.eot');
            src: url('//cdn.jsdelivr.net/font-nanumlight/1.0/NanumBarunGothicWebBold.eot?#iefix') format('embedded-opentype'), url('//cdn.jsdelivr.net/font-nanumlight/1.0/NanumBarunGothicWebBold.woff') format('woff'), url('//cdn.jsdelivr.net/font-nanumlight/1.0/NanumBarunGothicWebBold.ttf') format('truetype')
        }
        
        body {
            /* 폰트를 나눔바른고딕으로 변경 */
            font-family: 'NanumBarunGothic', sans-serif;
            background-color: #FAFAF7; /* 아이보리/베이지 톤의 따뜻하고 고급스러운 배경 */
            /* 폰트가 변경되었으므로 크기를 원래의 정갈한 사이즈로 되돌림 */
            font-size: 16px; 
        }
        /* 고급스러운 컬러 팔레트 커스텀 */
        .text-primary-dark { color: #2D3A45; } /* 차분한 다크 블루/그레이 */
        .text-accent-blue { color: #628CA6; } /* 우아하고 신뢰감 있는 연한 블루 */
        .bg-accent-blue { background-color: #628CA6; }
        .bg-soft-blue { background-color: #F0F4F8; } /* 아주 연한 블루 (하이라이트용) */
        .bg-beige { background-color: #F5F2EB; } /* 부드러운 베이지 */
        .border-beige { border-color: #E8E5DC; }
        .border-accent-blue { border-color: #628CA6; }
        
        /* 슬라이더(range) 커스텀 스타일 - 둥글고 부드러운 느낌 */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 22px;
            width: 22px;
            border-radius: 50%;
            background: #628CA6;
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 2px 6px rgba(98, 140, 166, 0.3);
            border: 2px solid #ffffff;
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #E8E5DC;
            border-radius: 4px;
        }
        input[type=range]:focus {
            outline: none;
        }
        /* 테이블 스크롤 및 모바일 최적화 */
        .table-container {
            max-height: 500px;
            overflow-y: auto;
        }
        /* 넘버 인풋 화살표 숨기기 */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
        /* 스크롤바 고급화 */
        .table-container::-webkit-scrollbar {
            width: 8px;
        }
        .table-container::-webkit-scrollbar-track {
            background: #FAFAF7; 
            border-radius: 4px;
        }
        .table-container::-webkit-scrollbar-thumb {
            background: #D5D1C8; 
            border-radius: 4px;
        }
        .table-container::-webkit-scrollbar-thumb:hover {
            background: #C4C0B6; 
        }
        
        /* 캐릭터 회전 애니메이션 */
        @keyframes spin-once {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .spin-action {
            animation: spin-once 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* 통통 튀는 회전 효과 */
        }
    </style>
</head>
<body class="text-gray-800 antialiased py-8 px-4 sm:px-6 lg:px-8 min-h-screen flex items-center justify-center">

    <div class="max-w-4xl w-full bg-white rounded-3xl shadow-[0_10px_40px_-10px_rgba(0,0,0,0.08)] overflow-hidden border border-gray-100">
        <!-- 헤더 섹션: 화이트/베이지 톤으로 부드럽게 -->
        <div class="bg-white border-b border-beige p-8 flex items-center justify-between relative overflow-hidden">
            <!-- 배경 장식용 부드러운 원형 그라데이션 -->
            <div class="absolute top-0 right-0 -mr-16 -mt-16 w-48 h-48 rounded-full bg-soft-blue opacity-50 blur-3xl pointer-events-none"></div>
            
            <div class="relative z-10">
                <!-- 이전 화면으로 돌아가기 버튼 -->
                <a href="https://kfcc004-bit.github.io/mg0824" class="inline-flex items-center text-sm font-bold text-gray-500 hover:text-accent-blue transition-colors mb-4 group cursor-pointer">
                    <div class="bg-[#FAFAF7] border border-beige rounded-full p-1.5 mr-2 group-hover:bg-soft-blue group-hover:border-accent-blue transition-colors shadow-sm">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7"></path>
                        </svg>
                    </div>
                    이전 화면으로
                </a>
                
                <!-- 제목 폰트 클래스를 일반적인 크기로 되돌림 -->
                <h1 class="text-2xl font-bold tracking-tight text-primary-dark">MG 맞춤형 대출 상환 계산기</h1>
                <!-- 부제목 폰트 클래스를 일반적인 크기로 되돌림 -->
                <p class="text-accent-blue mt-2 text-sm font-medium">고객님의 든든한 내일, 새마을금고가 함께합니다.</p>
            </div>
            
            <div class="relative z-10 hidden sm:flex items-center justify-center group cursor-pointer ml-auto">
                <div class="h-24 w-auto flex items-center justify-center transition-transform duration-300 group-hover:scale-110 group-hover:-translate-y-1 relative">
                    <!-- 이미지가 깨지지 않도록 원본 캐릭터를 완벽히 똑같이 본뜬 SVG 코드로 대체 -->
                    <svg id="kimGeumGo" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" class="h-full w-auto object-contain drop-shadow-md">
                        <!-- 그림자 -->
                        <ellipse cx="60" cy="115" rx="25" ry="3" fill="rgba(0,0,0,0.1)"/>
                        
                        <!-- 왼쪽 팔 -->
                        <path d="M 28 58 Q 12 45 8 50 Q 5 53 25 68 Z" fill="#4285F4"/>
                        <!-- 오른쪽 팔 -->
                        <path d="M 92 58 Q 108 45 112 50 Q 115 53 95 68 Z" fill="#4285F4"/>
                        
                        <!-- 왼쪽 다리 -->
                        <path d="M 40 95 L 40 108 Q 40 113 32 112 Q 28 111 32 107 Q 35 106 35 103 L 36 95 Z" fill="#4285F4"/>
                        <!-- 오른쪽 다리 -->
                        <path d="M 80 95 L 80 108 Q 80 113 88 112 Q 92 111 88 107 Q 85 106 85 103 L 84 95 Z" fill="#4285F4"/>
                        
                        <!-- 몸통 (파란 네모) -->
                        <rect x="25" y="25" width="70" height="70" rx="6" fill="#4285F4"/>
                        
                        <!-- 머리 위 구름모양 장식 -->
                        <circle cx="60" cy="18" r="7" fill="#4285F4"/>
                        <circle cx="53" cy="22" r="5" fill="#4285F4"/>
                        <circle cx="67" cy="22" r="5" fill="#4285F4"/>
                        <rect x="50" y="20" width="20" height="10" fill="#4285F4"/>
                        
                        <!-- 얼굴 (흰색 동그라미) -->
                        <circle cx="60" cy="60" r="28" fill="#FFFFFF"/>
                        
                        <!-- 눈 -->
                        <circle cx="48" cy="54" r="4.5" fill="#000000"/>
                        <circle cx="49" cy="52.5" r="1.5" fill="#FFFFFF"/>
                        
                        <circle cx="72" cy="54" r="4.5" fill="#000000"/>
                        <circle cx="73" cy="52.5" r="1.5" fill="#FFFFFF"/>
                        
                        <!-- 볼터치 (핑크색 그라데이션) -->
                        <defs>
                            <radialGradient id="blush" cx="50%" cy="50%" r="50%">
                                <stop offset="0%" stop-color="#FF8CA3" stop-opacity="0.8"/>
                                <stop offset="100%" stop-color="#FF8CA3" stop-opacity="0"/>
                            </radialGradient>
                        </defs>
                        <circle cx="41" cy="61" r="5" fill="url(#blush)"/>
                        <circle cx="79" cy="61" r="5" fill="url(#blush)"/>
                        
                        <!-- 입 -->
                        <path d="M 54 61 Q 60 64 66 61 Q 65 71 60 71 Q 55 71 54 61 Z" fill="#000000"/>
                    </svg>
                </div>
                <!-- 툴팁 (말풍선) -->
                <div class="absolute -bottom-11 right-0 bg-primary-dark text-white text-xs font-bold px-3 py-2 rounded-lg opacity-0 group-hover:opacity-100 transition-all duration-300 transform translate-y-2 group-hover:translate-y-0 whitespace-nowrap shadow-lg pointer-events-none">
                    MG 든든 요정 김금고
                    <!-- 툴팁 꼬리 -->
                    <div class="absolute -top-1 right-6 w-3 h-3 bg-primary-dark transform rotate-45"></div>
                </div>
            </div>
        </div>

        <div class="p-6 md:p-10 flex flex-col md:flex-row gap-10">
            <!-- 좌측 입력 폼 -->
            <div class="w-full md:w-1/2 space-y-7">
                
                <!-- 1. 대출 금액 입력 -->
                <div>
                    <!-- 라벨 폰트 클래스를 일반적인 크기로 되돌림 -->
                    <label class="block text-sm font-semibold text-primary-dark mb-2">대출 금액 (만원)</label>
                    <div class="relative">
                        <!-- 입력창 폰트 클래스를 일반적인 크기로 되돌림 -->
                        <input type="text" id="loanAmount" class="block w-full pl-4 pr-14 py-3.5 bg-[#FAFAF7] border border-beige rounded-xl focus:ring-2 focus:ring-accent-blue focus:border-accent-blue focus:bg-white transition-all text-right text-lg font-semibold text-gray-800" placeholder="0" oninput="formatNumberInput(this); calculateLoan();">
                        <!-- 단위 폰트 클래스를 일반적인 크기로 되돌림 -->
                        <span class="absolute inset-y-0 right-4 flex items-center pl-2 text-gray-500 font-medium pointer-events-none">만원</span>
                    </div>
                    <!-- 금액 퀵 버튼 -->
                    <div class="mt-3 flex gap-2">
                        <!-- 버튼 폰트 클래스를 일반적인 크기로 되돌림 -->
                        <button type="button" class="flex-1 py-2.5 bg-white text-gray-600 rounded-xl text-sm font-medium hover:bg-soft-blue hover:text-accent-blue hover:border-accent-blue transition-colors border border-beige shadow-sm" onclick="addAmount(100)">+100만</button>
                        <button type="button" class="flex-1 py-2.5 bg-white text-gray-600 rounded-xl text-sm font-medium hover:bg-soft-blue hover:text-accent-blue hover:border-accent-blue transition-colors border border-beige shadow-sm" onclick="addAmount(500)">+500만</button>
                        <button type="button" class="flex-1 py-2.5 bg-white text-gray-600 rounded-xl text-sm font-medium hover:bg-soft-blue hover:text-accent-blue hover:border-accent-blue transition-colors border border-beige shadow-sm" onclick="addAmount(1000)">+1000만</button>
                        <button type="button" class="flex-1 py-2.5 bg-[#FAFAF7] text-gray-500 rounded-xl text-sm font-medium hover:bg-gray-100 transition-colors border border-beige shadow-sm" onclick="clearAmount()">초기화</button>
                    </div>
                </div>

                <!-- 2. 대출 기간 입력 -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <!-- 라벨 폰트 클래스를 일반적인 크기로 되돌림 -->
                        <label class="block text-sm font-semibold text-primary-dark">대출 기간</label>
                        <div class="flex items-center gap-2">
                            <!-- 뱃지 폰트 클래스를 일반적인 크기로 되돌림 -->
                            <span class="text-sm font-semibold text-accent-blue bg-soft-blue px-3 py-1 rounded-full" id="periodDisplay">12 개월</span>
                        </div>
                    </div>
                    <div class="flex gap-3 items-center">
                        <!-- 셀렉트 박스 폰트 클래스를 일반적인 크기로 되돌림 -->
                        <select id="periodType" class="block w-28 px-3 py-3.5 bg-[#FAFAF7] border border-beige rounded-xl focus:ring-2 focus:ring-accent-blue focus:border-accent-blue focus:bg-white text-gray-700 font-medium transition-all" onchange="updatePeriodLabel(); calculateLoan();">
                            <option value="months">개월</option>
                            <option value="years">년</option>
                        </select>
                        <!-- 입력창 폰트 클래스를 일반적인 크기로 되돌림 -->
                        <input type="number" id="loanPeriod" class="block w-full px-4 py-3.5 bg-[#FAFAF7] border border-beige rounded-xl focus:ring-2 focus:ring-accent-blue focus:border-accent-blue focus:bg-white text-right font-semibold text-gray-800 transition-all text-lg" value="12" min="1" max="360" oninput="updatePeriodLabel(); calculateLoan();">
                    </div>
                    <div class="mt-5 px-1">
                        <input type="range" id="periodSlider" min="1" max="120" value="12" class="w-full" oninput="syncPeriodFromSlider(); calculateLoan();">
                    </div>
                </div>

                <!-- 3. 연 이자율 입력 -->
                <div>
                    <!-- 라벨 폰트 클래스를 일반적인 크기로 되돌림 -->
                    <label class="block text-sm font-semibold text-primary-dark mb-2">연 이자율 (%)</label>
                    <div class="relative">
                        <!-- 입력창 폰트 클래스를 일반적인 크기로 되돌림 -->
                        <input type="number" id="interestRate" step="0.1" class="block w-full pl-4 pr-10 py-3.5 bg-[#FAFAF7] border border-beige rounded-xl focus:ring-2 focus:ring-accent-blue focus:border-accent-blue focus:bg-white transition-all text-right text-lg font-semibold text-gray-800" value="5.0" min="0" max="24" oninput="calculateLoan()">
                        <!-- 단위 폰트 클래스를 일반적인 크기로 되돌림 -->
                        <span class="absolute inset-y-0 right-4 flex items-center pl-2 text-gray-500 font-medium pointer-events-none">%</span>
                    </div>
                </div>

                <!-- 4. 상환 방식 선택 -->
                <div>
                    <!-- 라벨 폰트 클래스를 일반적인 크기로 되돌림 -->
                    <label class="block text-sm font-semibold text-primary-dark mb-3">상환 방식</label>
                    <div class="grid grid-cols-1 gap-2 sm:grid-cols-3">
                        <label class="cursor-pointer">
                            <input type="radio" name="repaymentType" value="equalPrincipalAndInterest" class="peer sr-only" checked onchange="calculateLoan()">
                            <div class="rounded-xl border border-beige bg-white px-3 py-3.5 hover:bg-gray-50 peer-checked:border-accent-blue peer-checked:bg-soft-blue peer-checked:ring-1 peer-checked:ring-accent-blue text-center transition-all shadow-sm peer-checked:shadow-none">
                                <!-- 버튼 텍스트 폰트 클래스를 일반적인 크기로 되돌림 -->
                                <span class="text-sm font-bold text-gray-600 peer-checked:text-accent-blue">원리금균등</span>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="repaymentType" value="equalPrincipal" class="peer sr-only" onchange="calculateLoan()">
                            <div class="rounded-xl border border-beige bg-white px-3 py-3.5 hover:bg-gray-50 peer-checked:border-accent-blue peer-checked:bg-soft-blue peer-checked:ring-1 peer-checked:ring-accent-blue text-center transition-all shadow-sm peer-checked:shadow-none">
                                <!-- 버튼 텍스트 폰트 클래스를 일반적인 크기로 되돌림 -->
                                <span class="text-sm font-bold text-gray-600 peer-checked:text-accent-blue">원금균등</span>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="repaymentType" value="bullet" class="peer sr-only" onchange="calculateLoan()">
                            <div class="rounded-xl border border-beige bg-white px-3 py-3.5 hover:bg-gray-50 peer-checked:border-accent-blue peer-checked:bg-soft-blue peer-checked:ring-1 peer-checked:ring-accent-blue text-center transition-all shadow-sm peer-checked:shadow-none">
                                <!-- 버튼 텍스트 폰트 클래스를 일반적인 크기로 되돌림 -->
                                <span class="text-sm font-bold text-gray-600 peer-checked:text-accent-blue">만기일시</span>
                            </div>
                        </label>
                    </div>
                    <!-- 설명 텍스트 폰트 클래스를 일반적인 크기로 되돌림 -->
                    <p class="text-sm text-gray-500 mt-3 bg-[#FAFAF7] p-3.5 rounded-xl border border-beige font-medium" id="repaymentDescription">매월 동일한 원금과 이자의 합계를 상환하는 방식입니다.</p>
                </div>
                
                <!-- 제출 버튼 폰트 클래스를 일반적인 크기로 되돌림 -->
                <button onclick="calculateLoan()" class="w-full bg-accent-blue text-white py-4 rounded-xl font-bold hover:bg-[#527993] transition-colors shadow-[0_8px_20px_rgba(98,140,166,0.3)] text-lg mt-4">
                    계산 결과 확인하기
                </button>
            </div>

            <!-- 우측 결과 뷰 -->
            <div class="w-full md:w-1/2 flex flex-col h-full pt-6 md:pt-0">
                
                <!-- 결과 요약 카드 -->
                <div class="bg-white rounded-2xl p-6 md:p-8 border border-beige mb-6 shadow-[0_4px_20px_rgba(0,0,0,0.02)] relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-1.5 h-full bg-accent-blue"></div>
                    <!-- 제목 폰트 클래스를 일반적인 크기로 되돌림 -->
                    <h3 class="text-lg font-bold text-primary-dark pb-2 mb-5">계산 결과 요약</h3>
                    
                    <div class="space-y-4 relative z-10">
                        <div class="flex justify-between items-center bg-[#FAFAF7] p-4 rounded-xl border border-beige">
                            <!-- 요약 라벨 폰트 클래스를 일반적인 크기로 되돌림 -->
                            <span class="text-sm text-gray-600 font-semibold">1회차 월 상환액</span>
                            <div class="text-right">
                                <!-- 금액 결과 폰트 클래스를 일반적인 크기로 되돌림 -->
                                <span class="text-2xl font-bold text-accent-blue" id="firstInstallment">0</span>
                                <span class="text-sm text-gray-600 font-bold ml-1">원</span>
                            </div>
                        </div>
                        
                        <div class="flex justify-between items-center px-2 pt-2">
                            <span class="text-sm text-gray-500 font-medium">총 대출 이자</span>
                            <div class="text-right">
                                <!-- 금액 결과 폰트 클래스를 일반적인 크기로 되돌림 -->
                                <span class="text-lg font-bold text-gray-700" id="totalInterest">0</span>
                                <span class="text-sm text-gray-500 ml-1">원</span>
                            </div>
                        </div>

                        <div class="flex justify-between items-center px-2 border-t border-beige pt-4 mt-2">
                            <!-- 요약 라벨 폰트 클래스를 일반적인 크기로 되돌림 -->
                            <span class="text-base text-primary-dark font-bold">총 상환 금액 (원금+이자)</span>
                            <div class="text-right">
                                <!-- 금액 결과 폰트 클래스를 일반적인 크기로 되돌림 -->
                                <span class="text-xl font-bold text-primary-dark" id="totalPayment">0</span>
                                <span class="text-sm text-gray-600 font-bold ml-1">원</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 회차별 상환 스케줄러 (테이블) -->
                <div class="flex-grow flex flex-col bg-white rounded-2xl border border-beige shadow-[0_4px_20px_rgba(0,0,0,0.02)] overflow-hidden">
                    <div class="p-4 md:p-5 border-b border-beige bg-[#FAFAF7]">
                        <!-- 테이블 제목 폰트 클래스를 일반적인 크기로 되돌림 -->
                        <h3 class="text-sm font-bold text-primary-dark">월별 상환 스케줄</h3>
                    </div>
                    <div class="table-container flex-grow bg-white">
                        <!-- 테이블 내용 폰트 클래스를 일반적인 크기로 되돌림 -->
                        <table class="min-w-full divide-y divide-beige text-sm">
                            <thead class="bg-[#FAFAF7] sticky top-0 z-10 shadow-sm">
                                <tr>
                                    <!-- 테이블 헤더 폰트 클래스를 일반적인 크기로 되돌림 -->
                                    <th scope="col" class="px-3 py-4 text-center font-bold text-primary-dark whitespace-nowrap">회차</th>
                                    <th scope="col" class="px-3 py-4 text-right font-bold text-primary-dark whitespace-nowrap">상환 원금</th>
                                    <th scope="col" class="px-3 py-4 text-right font-bold text-primary-dark whitespace-nowrap">이자</th>
                                    <th scope="col" class="px-3 py-4 text-right font-bold text-primary-dark whitespace-nowrap">월 납입금</th>
                                    <th scope="col" class="px-3 py-4 text-right font-bold text-primary-dark whitespace-nowrap">대출 잔액</th>
                                </tr>
                            </thead>
                            <tbody id="scheduleBody" class="bg-white divide-y divide-gray-100">
                                <!-- JavaScript로 테이블 로우 동적 생성 -->
                                <tr>
                                    <td colspan="5" class="px-6 py-16 text-center text-gray-400 bg-white">
                                        <div class="flex flex-col items-center justify-center space-y-3">
                                            <svg class="w-10 h-10 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                                            <!-- 빈 테이블 메세지 폰트 클래스를 일반적인 크기로 되돌림 -->
                                            <span class="font-medium text-sm">대출 조건을 입력하면 스케줄이 계산됩니다.</span>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <!-- 하단 안내 문구 폰트 클래스를 일반적인 크기로 되돌림 -->
                <p class="text-xs text-gray-400 mt-4 text-right pr-2 font-medium">* 본 결과는 단순 참고용으로 실제 금융기관 계산과 차이가 있을 수 있습니다.</p>
            </div>
        </div>
    </div>

    <script>
        // 숫자에 콤마(,) 추가
        const formatCurrency = (num) => {
            return Math.round(num).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        };

        // 입력 필드 숫자 포맷팅 (만원 단위)
        function formatNumberInput(input) {
            let value = input.value.replace(/[^0-9]/g, '');
            if (value === '') {
                input.value = '';
                return;
            }
            // 콤마 추가하여 다시 설정
            input.value = Number(value).toLocaleString('ko-KR');
        }

        // 금액 퀵 버튼 기능 (입력값은 만원 단위)
        function addAmount(amountInManwon) {
            const input = document.getElementById('loanAmount');
            let currentValue = Number(input.value.replace(/,/g, '')) || 0;
            currentValue += amountInManwon;
            input.value = currentValue.toLocaleString('ko-KR');
            calculateLoan();
        }

        // 금액 초기화
        function clearAmount() {
            document.getElementById('loanAmount').value = '';
            calculateLoan();
        }

        // 대출 기간 레이블 및 슬라이더 동기화
        function updatePeriodLabel() {
            const type = document.getElementById('periodType').value;
            const input = document.getElementById('loanPeriod');
            const display = document.getElementById('periodDisplay');
            const slider = document.getElementById('periodSlider');
            
            let val = parseInt(input.value) || 0;
            
            if (type === 'years') {
                display.innerText = `${val} 년 (${val * 12} 개월)`;
                slider.max = 30; // 최대 30년
            } else {
                display.innerText = `${val} 개월`;
                slider.max = 360; // 최대 360개월
            }
            slider.value = val;
        }

        // 슬라이더에서 인풋으로 동기화
        function syncPeriodFromSlider() {
            const type = document.getElementById('periodType').value;
            const input = document.getElementById('loanPeriod');
            const slider = document.getElementById('periodSlider');
            
            input.value = slider.value;
            updatePeriodLabel();
        }

        // 상환 방식 설명 업데이트
        function updateRepaymentDescription(type) {
            const desc = document.getElementById('repaymentDescription');
            switch (type) {
                case 'equalPrincipalAndInterest':
                    desc.innerText = '매월 동일한 금액(원금+이자)을 상환하는 방식입니다. (자금 계획이 용이)';
                    break;
                case 'equalPrincipal':
                    desc.innerText = '매월 동일한 원금을 상환하고, 이자는 잔액에 따라 줄어드는 방식입니다. (총 이자가 가장 적음)';
                    break;
                case 'bullet':
                    desc.innerText = '대출 기간 동안 이자만 납부하고, 만기에 원금을 일시 상환하는 방식입니다. (초기 부담 적음)';
                    break;
            }
        }

        // 핵심 대출 계산 로직
        function calculateLoan() {
            // 1. 입력값 가져오기
            const loanAmountInput = document.getElementById('loanAmount').value.replace(/,/g, '');
            const principal = Number(loanAmountInput) * 10000; // 만원 -> 원 단위 변환

            const periodVal = parseInt(document.getElementById('loanPeriod').value) || 0;
            const periodType = document.getElementById('periodType').value;
            const totalMonths = periodType === 'years' ? periodVal * 12 : periodVal;

            const annualRate = parseFloat(document.getElementById('interestRate').value) || 0;
            const monthlyRate = (annualRate / 100) / 12; // 월 이자율

            const repaymentType = document.querySelector('input[name="repaymentType"]:checked').value;
            updateRepaymentDescription(repaymentType);

            // 유효성 검사
            const tbody = document.getElementById('scheduleBody');
            if (principal <= 0 || totalMonths <= 0 || annualRate <= 0) {
                document.getElementById('firstInstallment').innerText = '0';
                document.getElementById('totalInterest').innerText = '0';
                document.getElementById('totalPayment').innerText = '0';
                tbody.innerHTML = '<tr><td colspan="5" class="px-6 py-10 text-center text-gray-400">올바른 대출 조건을 입력해주세요.</td></tr>';
                return;
            }

            // 2. 상환 스케줄 계산
            let schedule = [];
            let remainingPrincipal = principal;
            let totalInterestPaid = 0;
            let firstMonthPayment = 0;

            if (repaymentType === 'equalPrincipalAndInterest') {
                /* 원리금 균등 분할 상환: 월 납입금 = 원금 * (월이자율 * (1+월이자율)^총개월수) / ((1+월이자율)^총개월수 - 1) */
                // 이자율이 0일 경우 예외 처리
                let monthlyPayment = 0;
                if(annualRate === 0) {
                     monthlyPayment = principal / totalMonths;
                } else {
                     const mathPow = Math.pow(1 + monthlyRate, totalMonths);
                     monthlyPayment = principal * (monthlyRate * mathPow) / (mathPow - 1);
                }
                
                for (let i = 1; i <= totalMonths; i++) {
                    let interest = remainingPrincipal * monthlyRate;
                    let principalPayment = monthlyPayment - interest;
                    
                    // 마지막 달 단수 차이 조정
                    if (i === totalMonths) {
                        principalPayment = remainingPrincipal;
                        monthlyPayment = principalPayment + interest;
                        remainingPrincipal = 0;
                    } else {
                        remainingPrincipal -= principalPayment;
                    }

                    totalInterestPaid += interest;
                    schedule.push({
                        month: i,
                        principalPayment: principalPayment,
                        interest: interest,
                        monthlyPayment: monthlyPayment,
                        balance: Math.max(0, remainingPrincipal) // 마이너스 방지
                    });
                }
                firstMonthPayment = schedule[0].monthlyPayment;

            } else if (repaymentType === 'equalPrincipal') {
                /* 원금 균등 분할 상환: 매월 동일한 원금 + 남은 원금에 대한 이자 */
                let fixedPrincipalPayment = principal / totalMonths;

                for (let i = 1; i <= totalMonths; i++) {
                    let interest = remainingPrincipal * monthlyRate;
                    let principalPayment = fixedPrincipalPayment;
                    
                    // 마지막 달 단수 차이 조정
                    if (i === totalMonths) {
                         principalPayment = remainingPrincipal;
                    }
                    
                    let monthlyPayment = principalPayment + interest;
                    remainingPrincipal -= principalPayment;
                    
                    totalInterestPaid += interest;
                    schedule.push({
                        month: i,
                        principalPayment: principalPayment,
                        interest: interest,
                        monthlyPayment: monthlyPayment,
                        balance: Math.max(0, remainingPrincipal)
                    });
                }
                firstMonthPayment = schedule[0].monthlyPayment;

            } else if (repaymentType === 'bullet') {
                /* 만기 일시 상환: 매월 이자만 납부, 마지막 달에 원금+이자 일시 납부 */
                let monthlyInterest = principal * monthlyRate;
                
                for (let i = 1; i <= totalMonths; i++) {
                    let interest = monthlyInterest;
                    let principalPayment = 0;
                    
                    if (i === totalMonths) {
                        principalPayment = principal;
                        remainingPrincipal = 0;
                    }

                    let monthlyPayment = principalPayment + interest;
                    totalInterestPaid += interest;
                    
                    schedule.push({
                        month: i,
                        principalPayment: principalPayment,
                        interest: interest,
                        monthlyPayment: monthlyPayment,
                        balance: remainingPrincipal
                    });
                }
                firstMonthPayment = schedule[0].monthlyPayment;
            }

            // 3. UI 업데이트
            document.getElementById('firstInstallment').innerText = formatCurrency(firstMonthPayment);
            document.getElementById('totalInterest').innerText = formatCurrency(totalInterestPaid);
            document.getElementById('totalPayment').innerText = formatCurrency(principal + totalInterestPaid);

            // 김금고 캐릭터 회전 애니메이션 실행 (연속 입력 시 애니메이션 끊김 방지)
            const kimGeumGo = document.getElementById('kimGeumGo');
            if (kimGeumGo) {
                // 현재 회전 중이 아닐 때만 회전 클래스를 추가하여 끝까지 돌게 함
                if (!kimGeumGo.classList.contains('spin-action')) {
                    kimGeumGo.classList.add('spin-action');
                    // 애니메이션 지속시간(0.6초)이 지난 후 클래스를 제거하여 다음 변경 시 다시 돌 수 있도록 준비
                    setTimeout(() => {
                        kimGeumGo.classList.remove('spin-action');
                    }, 600);
                }
            }

            // 테이블 렌더링
            tbody.innerHTML = '';
            let htmlStr = '';
            schedule.forEach(row => {
                htmlStr += `
                    <tr class="hover:bg-soft-blue transition-colors group">
                        <td class="px-3 py-3.5 text-center text-gray-500 font-medium group-hover:text-accent-blue transition-colors border-b border-gray-50">${row.month}</td>
                        <td class="px-3 py-3.5 text-right text-gray-700 border-b border-gray-50">${formatCurrency(row.principalPayment)}</td>
                        <td class="px-3 py-3.5 text-right text-gray-500 border-b border-gray-50">${formatCurrency(row.interest)}</td>
                        <td class="px-3 py-3.5 text-right font-bold text-accent-blue border-b border-gray-50">${formatCurrency(row.monthlyPayment)}</td>
                        <td class="px-3 py-3.5 text-right text-gray-400 border-b border-gray-50">${formatCurrency(row.balance)}</td>
                    </tr>
                `;
            });
            tbody.innerHTML = htmlStr;
        }

        // 초기화 시 한번 실행 및 이벤트 리스너 세팅
        window.onload = () => {
            // 초기 라디오 버튼 세팅 및 설명 업데이트용
            const initialType = document.querySelector('input[name="repaymentType"]:checked').value;
            updateRepaymentDescription(initialType);
            
            // 라디오 버튼 이벤트 리스너 세팅
            document.querySelectorAll('input[name="repaymentType"]').forEach(radio => {
                radio.addEventListener('change', calculateLoan);
            });
        };
    </script>
</body>
</html>
