<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>업무 FAQ 검색</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #2563eb;
      --primary-soft: #eff6ff;
      --highlight: #fef08a;
      --shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo",
        BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      width: min(980px, calc(100% - 32px));
      margin: 48px auto;
    }

    .header {
      margin-bottom: 24px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 4vw, 40px);
      letter-spacing: -0.04em;
    }

    .header p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .search-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .search-row {
      display: flex;
      gap: 10px;
    }

    .search-input {
      flex: 1;
      min-width: 0;
      height: 48px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 0 15px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    button {
      border: 0;
      font: inherit;
      cursor: pointer;
    }

    .reset-button {
      flex: 0 0 auto;
      height: 48px;
      padding: 0 18px;
      border-radius: 12px;
      background: #111827;
      color: #fff;
      font-weight: 700;
    }

    .category-area {
      margin-top: 18px;
    }

    .category-label {
      display: block;
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: 700;
      color: #374151;
    }

    .category-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .category-button {
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: #4b5563;
      font-weight: 700;
      transition: 0.2s;
    }

    .category-button:hover {
      border-color: #93c5fd;
      background: #f8fbff;
    }

    .category-button.active {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary);
    }

    .result-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 28px 2px 12px;
    }

    .result-count {
      font-size: 15px;
      font-weight: 800;
    }

    .result-count strong {
      color: var(--primary);
    }

    .result-list {
      display: grid;
      gap: 14px;
    }

    .faq-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 5px 18px rgba(15, 23, 42, 0.04);
    }

    .faq-category {
      display: inline-block;
      margin-bottom: 10px;
      padding: 5px 9px;
      border-radius: 8px;
      background: #f3f4f6;
      color: #4b5563;
      font-size: 12px;
      font-weight: 800;
    }

    .faq-question {
      margin: 0 0 12px;
      font-size: 18px;
      line-height: 1.55;
      letter-spacing: -0.02em;
    }

    .faq-answer {
      margin: 0;
      color: #4b5563;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    mark {
      padding: 0 2px;
      border-radius: 3px;
      background: var(--highlight);
      color: inherit;
    }

    .empty {
      padding: 48px 20px;
      border: 1px dashed #cbd5e1;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.75);
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 640px) {
      .app {
        width: min(100% - 20px, 980px);
        margin: 24px auto;
      }

      .search-row {
        flex-direction: column;
      }

      .reset-button {
        width: 100%;
      }

      .faq-card {
        padding: 17px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>업무 FAQ 검색</h1>
      <p>사내 FAQ에서 질문이나 키워드를 검색하세요.</p>
    </header>

    <section class="search-panel" aria-label="FAQ 검색 조건">
      <div class="search-row">
        <input
          id="searchInput"
          class="search-input"
          type="search"
          placeholder="질문이나 키워드를 입력하세요."
          aria-label="질문이나 키워드 검색"
          autocomplete="off"
        />
        <button id="resetButton" class="reset-button" type="button">
          전체보기
        </button>
      </div>

      <div class="category-area">
        <span class="category-label">분류</span>
        <div id="categoryList" class="category-list" aria-label="FAQ 분류">
          <button class="category-button active" type="button" data-category="전체">전체</button>
          <button class="category-button" type="button" data-category="교육">교육</button>
          <button class="category-button" type="button" data-category="문서">문서</button>
          <button class="category-button" type="button" data-category="IT">IT</button>
          <button class="category-button" type="button" data-category="보안">보안</button>
        </div>
      </div>
    </section>

    <div class="result-toolbar">
      <div id="resultCount" class="result-count" aria-live="polite"></div>
    </div>

    <section id="resultList" class="result-list" aria-label="검색 결과"></section>
  </main>

  <script>
    // 첨부 JSON의 내용만 사용합니다.
    const faqData = [
      {
        category: "교육",
        question: "교육 신청은 어디에서 하나요?",
        answer: "교육 포털의 과정 검색 후 신청 메뉴를 사용합니다."
      },
      {
        category: "교육",
        question: "신청한 교육을 취소하려면 어떻게 하나요?",
        answer: "신청내역에서 취소 가능 여부를 확인합니다."
      },
      {
        category: "문서",
        question: "주간 업무보고에는 무엇을 넣어야 하나요?",
        answer: "주요 실적, 이슈, 다음 주 계획을 중심으로 작성합니다."
      },
      {
        category: "IT",
        question: "사내 시스템 접속이 되지 않습니다.",
        answer: "네트워크, 브라우저, 계정 상태를 순서대로 확인합니다."
      },
      {
        category: "보안",
        question: "ChatGPT에 내부 업무자료를 넣어도 되나요?",
        answer: "교육에서는 합성자료를 사용하고, 실제 자료는 조직의 보안 및 AI 사용 기준을 먼저 확인합니다."
      }
    ];

    const searchInput = document.getElementById("searchInput");
    const resetButton = document.getElementById("resetButton");
    const categoryList = document.getElementById("categoryList");
    const resultCount = document.getElementById("resultCount");
    const resultList = document.getElementById("resultList");

    let selectedCategory = "전체";

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeRegExp(value) {
      return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function highlight(text, keyword) {
      const safeText = escapeHtml(text);
      const trimmedKeyword = keyword.trim();

      if (!trimmedKeyword) {
        return safeText;
      }

      const pattern = new RegExp(`(${escapeRegExp(trimmedKeyword)})`, "gi");
      return safeText.replace(pattern, "<mark>$1</mark>");
    }

    function getFilteredFaqs() {
      const keyword = searchInput.value.trim().toLowerCase();

      return faqData.filter((item) => {
        const matchesCategory =
          selectedCategory === "전체" || item.category === selectedCategory;

        const searchableText =
          `${item.question} ${item.answer} ${item.category}`.toLowerCase();

        const matchesKeyword =
          keyword === "" || searchableText.includes(keyword);

        return matchesCategory && matchesKeyword;
      });
    }

    function render() {
      const keyword = searchInput.value.trim();
      const filteredFaqs = getFilteredFaqs();

      resultCount.innerHTML =
        `검색 결과 <strong>${filteredFaqs.length}</strong>건`;

      if (filteredFaqs.length === 0) {
        resultList.innerHTML = `
          <div class="empty">
            검색 조건에 맞는 FAQ가 없습니다.
          </div>
        `;
        return;
      }

      resultList.innerHTML = filteredFaqs.map((item) => `
        <article class="faq-card">
          <span class="faq-category">${highlight(item.category, keyword)}</span>
          <h2 class="faq-question">${highlight(item.question, keyword)}</h2>
          <p class="faq-answer">${highlight(item.answer, keyword)}</p>
        </article>
      `).join("");
    }

    searchInput.addEventListener("input", render);

    categoryList.addEventListener("click", (event) => {
      const button = event.target.closest(".category-button");
      if (!button) return;

      selectedCategory = button.dataset.category;

      document.querySelectorAll(".category-button").forEach((item) => {
        item.classList.toggle("active", item === button);
      });

      render();
    });

    resetButton.addEventListener("click", () => {
      searchInput.value = "";
      selectedCategory = "전체";

      document.querySelectorAll(".category-button").forEach((button) => {
        button.classList.toggle(
          "active",
          button.dataset.category === "전체"
        );
      });

      render();
      searchInput.focus();
    });

    render();
  </script>
</body>
</html>
